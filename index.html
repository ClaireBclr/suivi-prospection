<!--
  =====================================================================
  SUIVI DE PROSPECTION TÉLÉPHONIQUE — fichier unique, déployable en statique
  =====================================================================

  MISE EN PLACE SUPABASE (à faire une seule fois, dans l'éditeur SQL) :

    create table if not exists public.kv_store (
      key   text primary key,
      value jsonb not null
    );
    alter table public.kv_store enable row level security;
    create policy "kv lecture"     on public.kv_store for select to anon using (true);
    create policy "kv ajout"       on public.kv_store for insert to anon with check (true);
    create policy "kv mise a jour" on public.kv_store for update to anon using (true) with check (true);
    create policy "kv suppression" on public.kv_store for delete to anon using (true);

  Puis renseigner SUPABASE_URL et SUPABASE_ANON_KEY plus bas (Project Settings > API).

  CLÉS UTILISÉES DANS kv_store :
    team:admin              { ownerHash, creeLe }            code propriétaire (haché SHA-256)
    team:managers           [ { id, name, code, creeLe } ]   managers secondaires (Claire pré-créée)
    team:reps               [ { id, name, password, managerId, creeLe } ]
    team:entries:<idRep>    { "2026-W44": { heures, appels, ... , majLe } }
  Chaque téléprospecteur a sa propre clé de saisies : deux personnes qui enregistrent
  en même temps ne peuvent pas écraser les chiffres l'une de l'autre.
-->

<style>
/* ============ Thème ============ */
:root{
  --bg:#F6F5F2;
  --surface:#FFFFFF;
  --surface-2:#FBFAF8;
  --texte:#1C1917;
  --texte-2:#57534E;
  --muted:#8A847E;
  --bord:#E8E5E0;
  --bord-fort:#D6D2CC;
  --accent:#EA580C;
  --accent-fonce:#C2410C;
  --accent-doux:#FFF1E7;
  --accent-ligne:#FED7BA;
  --ok:#15803D; --ok-doux:#E8F6EC;
  --alerte:#B45309; --alerte-doux:#FEF3E2;
  --danger:#DC2626; --danger-doux:#FDECEC;
  --n1:#E5484D; --n2:#F5A524; --n3:#F97316; --n4:#16A34A;
  --rayon:16px; --rayon-s:10px;
  --ombre:0 1px 2px rgba(28,25,23,.04), 0 4px 16px rgba(28,25,23,.05);
  --ombre-haute:0 12px 40px rgba(28,25,23,.14), 0 2px 6px rgba(28,25,23,.06);
  --f-titre:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-texte:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --transition:160ms cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--texte);
  font:400 15px/1.5 var(--f-texte);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3{font-family:var(--f-titre); letter-spacing:-.02em; margin:0; line-height:1.15}
h1{font-size:28px; font-weight:700}
h2{font-size:18px; font-weight:600}
h3{font-size:15px; font-weight:600}
p{margin:0}
button,input,select{font:inherit; color:inherit}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:18px; height:18px; flex:none}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ============ Boutons ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:40px; padding:0 16px; border-radius:var(--rayon-s);
  border:1px solid transparent; font-weight:600; font-size:14px;
  cursor:pointer; white-space:nowrap;
  transition:background var(--transition), border-color var(--transition), transform var(--transition), box-shadow var(--transition), color var(--transition);
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55; cursor:not-allowed}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 1px 2px rgba(194,65,12,.3), inset 0 1px 0 rgba(255,255,255,.15)}
.btn-primary:hover:not(:disabled){background:var(--accent-fonce); box-shadow:0 4px 14px rgba(234,88,12,.28)}
.btn-ghost{background:var(--surface); border-color:var(--bord); color:var(--texte-2)}
.btn-ghost:hover:not(:disabled){border-color:var(--bord-fort); color:var(--texte); background:var(--surface-2)}
.btn-danger{background:var(--danger); color:#fff}
.btn-danger:hover:not(:disabled){background:#B91C1C}
.btn-sm{height:32px; padding:0 12px; font-size:13px}
.btn-icone{
  width:34px; height:34px; padding:0; border-radius:9px;
  display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid transparent; color:var(--muted); cursor:pointer;
  transition:background var(--transition), color var(--transition), border-color var(--transition);
}
.btn-icone:hover{background:var(--surface-2); color:var(--texte); border-color:var(--bord)}
.btn-icone.danger:hover{color:var(--danger); background:var(--danger-doux); border-color:transparent}
.btn.charge{position:relative; color:transparent !important}
.btn.charge::after{
  content:""; position:absolute; width:16px; height:16px; border-radius:50%;
  border:2px solid rgba(255,255,255,.5); border-top-color:#fff; animation:tourne .7s linear infinite;
}
.btn-ghost.charge::after{border-color:var(--bord); border-top-color:var(--accent)}
@keyframes tourne{to{transform:rotate(360deg)}}

/* ============ Champs ============ */
.champ{display:flex; flex-direction:column; gap:6px; min-width:0}
.champ > span{font-size:13px; font-weight:500; color:var(--texte-2)}
.input, .champ input, .champ select{
  height:42px; width:100%; padding:0 12px;
  background:var(--surface); border:1px solid var(--bord); border-radius:var(--rayon-s);
  transition:border-color var(--transition), box-shadow var(--transition);
}
.champ input:hover, .champ select:hover{border-color:var(--bord-fort)}
.champ input:focus, .champ select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(234,88,12,.12)}
.mdp{position:relative}
.mdp input{padding-right:44px}
.oeil{
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; border:0; background:transparent; color:var(--muted);
  border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.oeil:hover{color:var(--texte); background:var(--surface-2)}
.form-erreur{
  display:flex; gap:8px; align-items:flex-start;
  color:var(--danger); background:var(--danger-doux); font-size:13px;
  padding:10px 12px; border-radius:var(--rayon-s);
}

/* ============ Écrans plein page (chargement, config, setup, connexion) ============ */
.ecran{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px}
.chargement{display:flex; flex-direction:column; align-items:center; gap:14px; color:var(--muted)}
.spinner{width:28px; height:28px; border-radius:50%; border:3px solid var(--bord); border-top-color:var(--accent); animation:tourne .8s linear infinite}

.carte-auth{
  width:100%; max-width:960px; display:grid; grid-template-columns:1.05fr 1fr;
  background:var(--surface); border-radius:24px; overflow:hidden; box-shadow:var(--ombre-haute);
  border:1px solid var(--bord);
}
.carte-auth.simple{max-width:460px; grid-template-columns:1fr}
.auth-marque{
  position:relative; padding:40px; color:#FFF7F0; overflow:hidden;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(249,115,22,.55), transparent 60%),
    radial-gradient(90% 70% at 0% 100%, rgba(234,88,12,.35), transparent 60%),
    #1C1917;
  display:flex; flex-direction:column; justify-content:space-between; gap:40px;
}
.auth-marque::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:32px 32px; mask-image:linear-gradient(180deg, #000, transparent 85%);
}
.auth-marque > *{position:relative; z-index:1}
.auth-marque h1{font-size:34px; color:#fff; max-width:14ch}
.auth-marque .sous{color:rgba(255,247,240,.72); margin-top:12px; max-width:36ch}
.auth-points{display:flex; flex-direction:column; gap:14px; margin:0; padding:0; list-style:none}
.auth-points li{display:flex; gap:12px; align-items:center; color:rgba(255,247,240,.86); font-size:14px}
.auth-points .pastille{width:32px; height:32px; border-radius:9px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; color:#FDBA8C}
.logo-ligne{display:flex; align-items:center; gap:12px; font-family:var(--f-titre); font-weight:700; font-size:17px}
.logo-ligne img{width:36px; height:36px; border-radius:10px; object-fit:contain; background:#fff}
.auth-form{padding:40px; display:flex; flex-direction:column; gap:22px; justify-content:center}
.auth-form h2{font-size:22px}
.auth-form .intro{color:var(--muted); font-size:14px; margin-top:4px}
.onglets{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--bg); border-radius:12px; border:1px solid var(--bord)}
.onglet{
  display:flex; align-items:center; justify-content:center; gap:8px;
  height:40px; border:0; border-radius:9px; background:transparent; color:var(--texte-2);
  font-weight:600; font-size:14px; cursor:pointer; transition:background var(--transition), color var(--transition), box-shadow var(--transition);
}
.onglet:hover{color:var(--texte)}
.onglet[aria-selected="true"]{background:var(--surface); color:var(--accent-fonce); box-shadow:0 1px 3px rgba(28,25,23,.1)}
.pile{display:flex; flex-direction:column; gap:16px}
.note{font-size:13px; color:var(--muted)}
.code-config{font-family:var(--f-mono); font-size:12.5px; background:var(--bg); border:1px solid var(--bord); padding:12px; border-radius:10px; overflow:auto; white-space:pre}

/* ============ Barre du haut ============ */
.topbar{
  position:sticky; top:0; z-index:20;
  background:rgba(255,255,255,.86); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--bord);
}
.topbar-in{max-width:1280px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:16px}
.topbar .logo-ligne{font-size:16px; min-width:0}
.topbar .logo-ligne img{width:32px; height:32px; border:1px solid var(--bord)}
.topbar .logo-ligne span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nav-semaine{
  margin:0 auto; display:flex; align-items:center; gap:4px;
  background:var(--bg); border:1px solid var(--bord); border-radius:12px; padding:3px;
}
.nav-semaine .btn-icone{width:32px; height:32px}
.nav-semaine .btn-icone:disabled{opacity:.35; cursor:not-allowed; background:transparent; border-color:transparent}
.semaine-label{
  border:0; background:transparent; cursor:pointer; padding:2px 12px; border-radius:8px;
  display:flex; flex-direction:column; align-items:center; line-height:1.2; min-width:170px;
}
.semaine-label:hover{background:var(--surface)}
.semaine-label strong{font-family:var(--f-titre); font-size:15px}
.semaine-label small{font-size:12px; color:var(--muted)}
.semaine-label .encours{color:var(--accent); font-weight:600}
.utilisateur{display:flex; align-items:center; gap:10px}
.avatar{
  width:34px; height:34px; border-radius:50%; flex:none;
  background:var(--accent-doux); color:var(--accent-fonce); border:1px solid var(--accent-ligne);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px;
}
.utilisateur .qui{display:flex; flex-direction:column; line-height:1.2}
.utilisateur .qui strong{font-size:14px}
.utilisateur .qui small{font-size:12px; color:var(--muted)}

/* ============ Mise en page ============ */
main{max-width:1280px; margin:0 auto; padding:28px 24px 64px; display:flex; flex-direction:column; gap:20px}
.entete-page{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.surtitre{font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; color:var(--accent-fonce); margin-bottom:6px}
.entete-page h1 .muted{font-weight:600}
.actions-page{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.filtre{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--texte-2)}
.filtre select{height:40px; border:1px solid var(--bord); border-radius:var(--rayon-s); background:var(--surface); padding:0 10px; font-weight:500}
.grille-2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
.carte{background:var(--surface); border:1px solid var(--bord); border-radius:var(--rayon); box-shadow:var(--ombre); min-width:0}
.carte-tete{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 14px; flex-wrap:wrap}
.carte-tete .titre{display:flex; align-items:center; gap:10px}
.carte-tete .titre .ic{color:var(--accent)}
.carte-tete p{font-size:13px; color:var(--muted); margin-top:2px}
.carte-corps{padding:0 20px 20px}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(4, 1fr); gap:16px}
.kpi{padding:18px 20px; display:flex; flex-direction:column; gap:8px; transition:transform var(--transition), box-shadow var(--transition)}
.kpi:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(28,25,23,.08)}
.kpi .lib{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--texte-2); font-weight:500}
.kpi .lib .ic{width:16px; height:16px; color:var(--accent)}
.kpi .val{font-family:var(--f-mono); font-size:28px; font-weight:600; letter-spacing:-.02em}
.kpi .det{font-size:12.5px; color:var(--muted)}
.kpi .det b{font-family:var(--f-mono); color:var(--texte-2); font-weight:600}

/* Tableaux */
.table-defile{overflow-x:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--bord)}
.table-defile::-webkit-scrollbar{height:10px}
.table-defile::-webkit-scrollbar-thumb{background:var(--bord); border-radius:10px; border:3px solid var(--surface)}
table.donnees{width:100%; border-collapse:separate; border-spacing:0; font-size:14px; min-width:1060px}
.donnees th, .donnees td{padding:12px 11px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--bord)}
.donnees thead th{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; color:var(--muted);
  background:var(--surface-2); position:sticky; top:0;
}
.donnees th:first-child, .donnees td:first-child{
  text-align:left; position:sticky; left:0; z-index:1; background:var(--surface);
  box-shadow:1px 0 0 var(--bord); min-width:200px;
}
.donnees thead th:first-child{background:var(--surface-2); z-index:2}
.donnees td{font-family:var(--f-mono); font-variant-numeric:tabular-nums; color:var(--texte)}
.donnees td:first-child{font-family:var(--f-texte)}
.donnees tbody tr{transition:background var(--transition)}
.donnees tbody tr:hover td{background:#FFFAF6}
.donnees th.sep, .donnees td.sep{border-left:1px solid var(--bord)}
.donnees td.taux{color:var(--accent-fonce); font-weight:600}
.donnees td.vide{color:#C9C4BE}
.donnees tfoot td{
  background:var(--accent-doux); font-weight:600; border-bottom:0; border-top:2px solid var(--accent-ligne);
}
.donnees tfoot td:first-child{background:var(--accent-doux); font-family:var(--f-titre); color:var(--accent-fonce)}
.nom-cell{display:flex; align-items:center; gap:10px}
.nom-cell .avatar{width:30px; height:30px; font-size:12px}
.nom-cell .nom{display:flex; flex-direction:column; line-height:1.25}
.nom-cell .nom small{font-size:12px; color:var(--muted)}
.puce{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; font-family:var(--f-texte)}
.puce-attente{background:var(--alerte-doux); color:var(--alerte)}
.puce-manager{background:var(--bg); color:var(--texte-2); border:1px solid var(--bord)}

/* Indicateur 4 barres */
.signal{display:inline-flex; align-items:flex-end; gap:3px; height:18px; vertical-align:middle}
.signal i{display:block; width:5px; border-radius:2px; background:var(--bord)}
.signal i:nth-child(1){height:6px} .signal i:nth-child(2){height:10px} .signal i:nth-child(3){height:14px} .signal i:nth-child(4){height:18px}
.signal.n1 i.on{background:var(--n1)} .signal.n2 i.on{background:var(--n2)} .signal.n3 i.on{background:var(--n3)} .signal.n4 i.on{background:var(--n4)}

/* Classements */
.segment{display:inline-flex; padding:3px; gap:2px; background:var(--bg); border:1px solid var(--bord); border-radius:10px}
.segment button{border:0; background:transparent; height:30px; padding:0 12px; border-radius:7px; font-size:13px; font-weight:600; color:var(--texte-2); cursor:pointer; transition:background var(--transition), color var(--transition)}
.segment button[aria-pressed="true"]{background:var(--surface); color:var(--accent-fonce); box-shadow:0 1px 2px rgba(28,25,23,.1)}
.mini-nav{display:inline-flex; align-items:center; gap:2px}
.mini-nav strong{font-family:var(--f-titre); font-size:14px; min-width:120px; text-align:center}
.classement{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.classement li{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:center}
.rang{width:28px; height:28px; border-radius:8px; background:var(--bg); color:var(--texte-2); font-family:var(--f-mono); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center}
.classement li:nth-child(1) .rang{background:var(--accent); color:#fff}
.classement li:nth-child(2) .rang{background:#FDBA8C; color:#7C2D12}
.classement li:nth-child(3) .rang{background:var(--accent-doux); color:var(--accent-fonce)}
.barre-nom{display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:6px; gap:8px}
.barre-nom span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.barre{height:8px; background:var(--bg); border-radius:999px; overflow:hidden}
.barre > i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg, #FDBA74, var(--accent)); width:0; transition:width 600ms cubic-bezier(.2,.7,.3,1)}
.classement .valeur{font-family:var(--f-mono); font-weight:600; font-size:15px; min-width:44px; text-align:right}
.vide-etat{display:flex; flex-direction:column; align-items:center; gap:8px; padding:28px 12px; color:var(--muted); text-align:center; font-size:14px}
.vide-etat .ic{width:26px; height:26px; color:var(--bord-fort)}

/* Listes équipe / managers */
.form-ligne{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; padding:16px; background:var(--surface-2); border:1px solid var(--bord); border-radius:12px; margin-bottom:14px}
.form-ligne.trois{grid-template-columns:1fr 1fr 1fr auto}
.liste{list-style:none; margin:0; padding:0}
.liste li{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--bord)}
.liste li:last-child{border-bottom:0}
.liste .infos{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.liste .infos strong{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.liste .infos small{font-size:12.5px; color:var(--muted)}
.secret-zone{display:inline-flex; align-items:center; gap:2px; background:var(--bg); border:1px solid var(--bord); border-radius:9px; padding:0 2px 0 10px; height:34px}
.secret{font-family:var(--f-mono); font-size:13px; min-width:80px; color:var(--texte-2)}
.secret-zone .btn-icone{width:30px; height:30px}
.lien{border:0; background:none; padding:0; color:var(--accent-fonce); font-weight:600; font-size:13px; cursor:pointer; display:inline-flex; gap:6px; align-items:center}
.lien:hover{text-decoration:underline}
.pied-carte{padding:14px 20px; border-top:1px solid var(--bord); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}

/* Saisie téléprospecteur */
.saisie{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr); gap:20px; align-items:start}
.groupe{padding:18px 20px; border-top:1px solid var(--bord)}
.groupe h3{display:flex; align-items:center; gap:8px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--texte-2); margin-bottom:14px}
.groupe h3 .ic{width:16px; height:16px; color:var(--accent)}
.champs{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px}
.champs.quatre{grid-template-columns:repeat(4, minmax(0,1fr))}
.champ-num input{font-family:var(--f-mono); font-size:17px; font-weight:600; height:48px}
.champ-num .unite{position:relative}
.champ-num .unite::after{content:attr(data-unite); position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none}
.barre-action{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-top:1px solid var(--bord); background:var(--surface-2); border-radius:0 0 var(--rayon) var(--rayon); flex-wrap:wrap}
.etat-saisie{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.etat-saisie .point{width:8px; height:8px; border-radius:50%; background:var(--bord-fort)}
.etat-saisie.modifie .point{background:var(--alerte)}
.etat-saisie.ok .point{background:var(--ok)}
.indicateurs{position:sticky; top:84px}
.jauge{padding:16px 20px; border-top:1px solid var(--bord)}
.jauge .haut{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.jauge .haut span{font-size:14px; color:var(--texte-2); font-weight:500}
.jauge .haut strong{font-family:var(--f-mono); font-size:26px; font-weight:600; letter-spacing:-.02em}
.jauge .formule{font-size:12px; color:var(--muted); margin-top:8px; font-family:var(--f-mono)}
.jauge.refus .barre > i{background:linear-gradient(90deg, #FCA5A5, var(--danger))}
.jauge.decroche .barre > i{background:linear-gradient(90deg, #FDE68A, var(--n2))}

/* Modale */
.modal-fond{
  position:fixed; inset:0; z-index:50; background:rgba(28,25,23,.42); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; padding:16px; animation:fondu 160ms ease-out;
}
.modal-fond.sortie{opacity:0; transition:opacity 150ms}
.modal{
  width:100%; max-width:460px; background:var(--surface); border-radius:20px; box-shadow:var(--ombre-haute);
  padding:24px; animation:monte 200ms cubic-bezier(.2,.7,.3,1); max-height:calc(100vh - 32px); overflow:auto;
}
.modal h3{font-size:19px; margin-bottom:16px}
.modal-corps{display:flex; flex-direction:column; gap:16px}
.modal-corps p{color:var(--texte-2); font-size:14px}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px}
.choix{border:0; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.choix legend{font-size:13px; font-weight:500; color:var(--texte-2); margin-bottom:6px; padding:0}
.option{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--bord); border-radius:12px; cursor:pointer; transition:border-color var(--transition), background var(--transition)}
.option:hover{border-color:var(--bord-fort)}
.option:has(input:checked){border-color:var(--accent); background:var(--accent-doux)}
.option input{accent-color:var(--accent); margin-top:3px}
.option strong{display:block; font-size:14px}
.option small{color:var(--muted); font-size:12.5px}
@keyframes fondu{from{opacity:0}}
@keyframes monte{from{opacity:0; transform:translateY(10px) scale(.98)}}

/* Toasts */
.toasts{position:fixed; right:20px; bottom:20px; z-index:60; display:flex; flex-direction:column; gap:10px; align-items:flex-end; pointer-events:none}
.toast{
  display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:12px; max-width:380px;
  background:#1C1917; color:#fff; font-size:14px; font-weight:500; box-shadow:var(--ombre-haute);
  opacity:0; transform:translateY(8px); transition:opacity 220ms, transform 220ms; pointer-events:auto;
}
.toast.visible{opacity:1; transform:none}
.toast-ok .ic{color:#4ADE80}
.toast-erreur{background:var(--danger)}

.apparait{animation:monte 280ms cubic-bezier(.2,.7,.3,1) both}

/* =====================================================================
   SEMAINES ISO ET MOIS
   Clé de semaine : "2026-W44". Une semaine appartient au mois de son jeudi
   (même règle que la norme ISO), ce qui évite de la compter deux fois.
   ===================================================================== */
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

function cleSemaine(dateUTC) {
  const t = new Date(dateUTC);
  const j = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - j);
  const annee = t.getUTCFullYear();
  const num = Math.ceil(((t - Date.UTC(annee, 0, 1)) / 864e5 + 1) / 7);
  return `${annee}-W${String(num).padStart(2, '0')}`;
}
function aujourdhui() {
  const d = new Date();
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
}
function lundi(cle) {
  const [a, n] = cle.split('-W').map(Number);
  const j4 = new Date(Date.UTC(a, 0, 4));
  const j = j4.getUTCDay() || 7;
  return new Date(Date.UTC(a, 0, 4 - j + 1 + (n - 1) * 7));
}
function decalerSemaine(cle, n) {
  const l = lundi(cle);
  l.setUTCDate(l.getUTCDate() + 7 * n);
  return cleSemaine(l);
}
function moisDeSemaine(cle) {
  const jeudi = lundi(cle);
  jeudi.setUTCDate(jeudi.getUTCDate() + 3);
  return `${jeudi.getUTCFullYear()}-${String(jeudi.getUTCMonth() + 1).padStart(2, '0')}`;
}
function semainesDuMois(mois) {
  const [a, m] = mois.split('-').map(Number);
  let cle = cleSemaine(new Date(Date.UTC(a, m - 1, 1)));
  const res = [];
  for (let i = 0; i < 6; i++) {
    if (moisDeSemaine(cle) === mois) res.push(cle);
    cle = decalerSemaine(cle, 1);
  }
  return res;
}
function decalerMois(mois, n) {
  const [a, m] = mois.split('-').map(Number);
  const d = new Date(Date.UTC(a, m - 1 + n, 1));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
}
const numSemaine = cle => Number(cle.split('-W')[1]);

  const l = lundi(cle);

  const f = x => `${x.getUTCDate()} ${MOIS_COURT[x.getUTCMonth()]}`;
  return `${f(l)} – ${f(d)} ${d.getUTCFullYear()}`;
}
function libelleMois(mois) {
  const [a, m] = mois.split('-').map(Number);
  const nom = MOIS[m - 1];
  return nom[0].toUpperCase() + nom.slice(1) + ' ' + a;
}
const semaineFichier = cle => cle.replace('-W', '-S');   // 2026-W44 -> 2026-S44

/* =====================================================================

const CONFIG_OK = !/VOTRE/.test(SUPABASE_URL) && !/VOTRE/.test(SUPABASE_ANON_KEY);

async function sb(chemin, options = {}) {
  let rep;
  try {
    rep = await fetch(`${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/${chemin}`, {
      ...options,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        ...(options.headers || {}),
      },
    });
  } catch {
    throw new Error('Connexion au serveur impossible. Vérifiez votre connexion internet puis réessayez.');
  }
  if (!rep.ok) {
    let detail = '';
    try { detail = (await rep.json()).message || ''; } catch { /* corps vide */ }
    if (rep.status === 401 || rep.status === 403) throw new Error("Accès refusé par Supabase : vérifiez la clé « anon » et les règles RLS de la table kv_store.");
    if (rep.status === 404 || /kv_store/.test(detail)) throw new Error("Table kv_store introuvable dans Supabase : exécutez le script SQL d'installation.");
    throw new Error(`Erreur du serveur (${rep.status})${detail ? ' : ' + detail : ''}.`);
  }
  const texte = await rep.text();
  return texte ? JSON.parse(texte) : null;
}
async function kvGet(cle) {
  const lignes = await sb(`kv_store?select=value&key=eq.${encodeURIComponent(cle)}`);
  return lignes && lignes.length ? lignes[0].value : null;
}
async function kvSet(cle, valeur) {
  await sb('kv_store?on_conflict=key', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ key: cle, value: valeur }),
  });
}
async function kvDel(cle) {
  await sb(`kv_store?key=eq.${encodeURIComponent(cle)}`, { method: 'DELETE' });
}
// Relit la liste la plus récente avant de la modifier, pour ne pas écraser
// un ajout fait entre-temps par un autre manager.
async function majListe(cle, modifier) {
  const liste = (await kvGet(cle)) || [];
  const nouvelle = modifier(liste);
  await kvSet(cle, nouvelle);
  return nouvelle;
}
// Code propriétaire : seule son empreinte SHA-256 est stockée
async function hacher(texte) {
  if (!crypto?.subtle) throw new Error('Votre navigateur bloque le chiffrement : ouvrez la page en https.');
  const tampon = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('prospection:' + texte));
  return [...new Uint8Array(tampon)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function chargerTout() {
  // Une seule requête : toutes les clés "team:*"
  const lignes = await sb('kv_store?select=key,value&key=like.team:*') || [];
  const carte = Object.fromEntries(lignes.map(l => [l.key, l.value]));

  S.entries = {};
  for (const [cle, valeur] of Object.entries(carte)) {
    if (cle.startsWith('team:entries:')) S.entries[cle.slice('team:entries:'.length)] = valeur || {};
  }
  // Premier lancement : Claire est créée d'office
  if (S.managers === null) {
    S.managers = [{ id: 'm_claire', name: 'Claire', code: CODE_CLAIRE_DEFAUT, creeLe: new Date().toISOString() }];
    await kvSet('team:managers', S.managers);

}

/* --- Calculs --- */
function zero() { return Object.fromEntries(CHAMPS.map(c => [c.k, 0])); }
function somme(liste) {
  const s = zero();
  for (const e of liste) if (e) for (const c of CHAMPS) s[c.k] += Number(e[c.k]) || 0;
  return s;
}
function avecTaux(e) {
  return { ...e, tDecroche: parSur(e.decroches, e.appels), tRetour: parSur(e.retours, e.appels), tRefus: parSur(e.refus, e.appels) };
}
const saisieSemaine = (idRep, semaine) => S.entries[idRep]?.[semaine] || null;
const totalMois = (idRep, mois) => somme(semainesDuMois(mois).map(s => saisieSemaine(idRep, s)));

function nomManager(id) {
  if (id === OWNER) return 'Propriétaire';
  return S.managers.find(m => m.id === id)?.name || 'Propriétaire';
}
// Téléprospecteurs que la personne connectée a le droit de voir
function repsVisibles() {
  const s = S.session;
  let liste = S.reps;
  if (s.role === 'manager') liste = S.reps.filter(r => r.managerId === s.id);
  else if (S.filtre === 'moi') liste = S.reps.filter(r => r.managerId === OWNER || !S.managers.some(m => m.id === r.managerId));
  else if (S.filtre !== 'tous') liste = S.reps.filter(r => r.managerId === S.filtre);
  return [...liste].sort((a, b) => a.name.localeCompare(b.name, 'fr'));
}
function niveauSignal(t) {
  if (t == null) return 0;
  return 1 + SEUILS_DECROCHE.filter(s => t >= s).length;
}
function signal(t) {
  const n = niveauSignal(t);
  const titre = t == null ? 'Pas de données' : `Taux de décroché : ${fmtPct(t)}`;
  return `<span class="signal n${n}" title="${titre}" aria-label="${titre}">${[1, 2, 3, 4].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
}

function lireSession() {

function sessionValide(s) {
  if (!s) return false;
  if (s.role === 'owner') return true;
  if (s.role === 'manager') return S.managers.some(m => m.id === s.id);
  if (s.role === 'rep') return S.reps.some(r => r.id === s.id);
  return false;
}

function afficher(id) {

}

function toast(message, type = 'ok') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.setAttribute('role', type === 'erreur' ? 'alert' : 'status');
  t.innerHTML = `${ic(type === 'ok' ? 'valide' : 'alerte')}<span>${esc(message)}</span>`;
  $('toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.add('visible'));
  setTimeout(() => { t.classList.remove('visible'); setTimeout(() => t.remove(), 300); }, type === 'erreur' ? 5500 : 3200);
}

// Exécute une action asynchrone avec état "chargement" sur le bouton et toast d'erreur
async function tenter(bouton, action) {
  if (bouton) { bouton.disabled = true; bouton.classList.add('charge'); }
  try { await action(); }
  catch (e) { console.error(e); toast(e.message || 'Une erreur est survenue.', 'erreur'); }
  finally { if (bouton && bouton.isConnected) { bouton.disabled = false; bouton.classList.remove('charge'); } }
}

/**
 * Modale générique. `valider(donnees)` peut lever une erreur : elle s'affiche
 * dans la modale sans la fermer. Renvoie les données saisies, ou null si annulé.
 */
function modale({ titre, html, ok = 'Valider', danger = false, valider }) {
  return new Promise(resoudre => {
    const fond = document.createElement('div');
    fond.className = 'modal-fond';
    fond.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
        <h3 id="modal-titre">${esc(titre)}</h3>
        <form class="modal-corps" novalidate>
          ${html}
          <p class="form-erreur" hidden></p>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-annuler>Annuler</button>
            <button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${esc(ok)}</button>
          </div>
        </form>
      </div>`;
    document.body.appendChild(fond);
    const form = fond.querySelector('form');
    const erreur = fond.querySelector('.form-erreur');
    const btnOk = form.querySelector('[type=submit]');
    const precedent = document.activeElement;

    const fermer = valeur => {
      document.removeEventListener('keydown', surTouche);
      fond.classList.add('sortie');
      setTimeout(() => fond.remove(), 150);
      if (precedent && precedent.focus) precedent.focus();
      resoudre(valeur);
    };
    const surTouche = e => { if (e.key === 'Escape') fermer(null); };
    document.addEventListener('keydown', surTouche);
    fond.addEventListener('mousedown', e => { if (e.target === fond) fermer(null); });
    fond.querySelector('[data-annuler]').addEventListener('click', () => fermer(null));
    form.addEventListener('submit', async e => {
      e.preventDefault();
      erreur.hidden = true;
      const donnees = Object.fromEntries(new FormData(form));
      btnOk.disabled = true; btnOk.classList.add('charge');
      try {
        if (valider) await valider(donnees);
        fermer(donnees);
      } catch (x) {
        erreur.innerHTML = `${ic('alerte')}<span>${esc(x.message)}</span>`;
        erreur.hidden = false;
        btnOk.disabled = false; btnOk.classList.remove('charge');
      }
    });
    setTimeout(() => (form.querySelector('input:not([type=radio]),select') || btnOk).focus(), 40);
  });
}
const confirmer = (titre, texte, ok = 'Supprimer') =>
  modale({ titre, html: `<p>${texte}</p>`, ok, danger: true });

// Champ mot de passe avec icône œil
function champMdp(nom, libelle, { auto = 'current-password', valeur = '', placeholder = '' } = {}) {

// Secret masqué par défaut, révélable par une icône œil (côté manager)
function secret(valeur, libelle) {
  return `<span class="secret-zone"><span class="secret" data-secret="${esc(valeur)}">••••••••</span>
    <button type="button" class="btn-icone" data-reveler aria-label="Afficher ${esc(libelle)}" title="Afficher / masquer">${ic('oeil')}</button></span>`;

// Délégation globale : œil des champs et révélation des secrets
document.addEventListener('click', e => {
  const oeil = e.target.closest('[data-oeil]');
  if (oeil) {
    const input = oeil.parentElement.querySelector('input');
    const montrer = input.type === 'password';
    input.type = montrer ? 'text' : 'password';
    oeil.innerHTML = ic(montrer ? 'oeilBarre' : 'oeil');
    oeil.setAttribute('aria-label', montrer ? 'Masquer la saisie' : 'Afficher la saisie');
    return;
  }
  const rev = e.target.closest('[data-reveler]');
  if (rev) {
    const s = rev.parentElement.querySelector('.secret');
    const visible = s.dataset.visible === '1';
    s.textContent = visible ? '••••••••' : s.dataset.secret;
    s.dataset.visible = visible ? '0' : '1';
    rev.innerHTML = ic(visible ? 'oeil' : 'oeilBarre');
  }
});

  return `

          ${cellules(total)}

        </tr></tfoot>

    </div>`;
}

            <div class="champs ${g.k === 'relances' ? 'quatre' : ''}">
              ${CHAMPS.filter(c => c.groupe === g.k).map(c => `
                <label class="champ champ-num"><span>${esc(c.label)}${c.unite ? ' (heures)' : ''}</span>
                  <div class="${c.unite ? 'unite' : ''}" data-unite="${c.unite || ''}">
                    <input type="number" name="${c.k}" min="0" step="${c.decimal ? '0.25' : '1'}" inputmode="${c.decimal ? 'decimal' : 'numeric'}" value="${actuel ? valeurs[c.k] : ''}" placeholder="0">
                  </div>
                </label>`).join('')}
            </div>
          </div>`).join('')}
        <p class="form-erreur" style="margin:0 20px 16px" hidden></p>
        <div class="barre-action">
          <span class="etat-saisie ${actuel ? 'ok' : ''}" id="etat-saisie"><span class="point"></span><span>${actuel ? 'Enregistré le ' + new Date(actuel.majLe).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : 'Pas encore déclaré'}</span></span>
          <button type="submit" class="btn btn-primary">${ic('valide')}Enregistrer la semaine</button>
        </div>
      </form>

      <aside class="carte indicateurs" aria-live="polite">
        <div class="carte-tete"><div><div class="titre">${ic('graphique')}<h2>Indicateurs</h2></div><p>Calculés en direct</p></div></div>
        <div id="jauges"></div>
      </aside>
    </div>

    <section class="carte apparait">
      <div class="carte-tete">
        <div><div class="titre">${ic('horloge')}<h2>Mes 4 dernières semaines</h2></div>
        <p>De la semaine ${numSemaine(semaines[3])} à la semaine ${numSemaine(semaines[0])}</p></div>
      </div>
      ${tableau({ premiereCol: 'Semaine', lignes: lignesHisto, total: totalHisto, libelleTotal: 'Total 4 semaines' })}
    </section>`;

  const form = $('form-saisie');
  const lire = () => Object.fromEntries(CHAMPS.map(c => [c.k, form.elements[c.k].value === '' ? 0 : Number(form.elements[c.k].value)]));
  const majJauges = () => {
    const d = avecTaux(lire());
    $('jauges').innerHTML = TAUX.map(t => `
      <div class="jauge ${t.classe}">
        <div class="haut"><span>${esc(t.label)}</span><strong>${fmtPct(d[t.k])}</strong></div>
        <div class="barre"><i style="width:${Math.min(100, (d[t.k] || 0) * 100)}%"></i></div>
        <p class="formule">${fmtNombre(d[t.num])} / ${fmtNombre(d.appels)} appels</p>
      </div>`).join('') + `
      <div class="jauge"><div class="haut"><span>Performance</span>${signal(d.tDecroche)}</div>
      <p class="formule" style="margin-top:0">Selon le taux de décroché</p></div>`;
  };
  majJauges();

  form.addEventListener('input', () => {
    S.saisieModifiee = true;
    const etat = $('etat-saisie');
    etat.className = 'etat-saisie modifie';
    etat.lastElementChild.textContent = 'Modifications non enregistrées';
    majJauges();
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const err = form.querySelector('.form-erreur');
    err.hidden = true;
    const d = lire();
    const probleme = (() => {
      for (const c of CHAMPS) {
        const v = d[c.k];
        if (!Number.isFinite(v) || v < 0) return `« ${c.label} » doit être un nombre positif.`;
        if (!c.decimal && !Number.isInteger(v)) return `« ${c.label} » doit être un nombre entier.`;
      }
      if (d.heures > 80) return 'Le temps de travail dépasse 80 heures sur la semaine : vérifiez la saisie.';
      if (d.decroches > d.appels) return 'Le nombre de décrochés ne peut pas dépasser le nombre d\'appels.';
      return null;
    })();
    if (probleme) { err.innerHTML = `${ic('alerte')}<span>${esc(probleme)}</span>`; err.hidden = false; return; }

    tenter(form.querySelector('[type=submit]'), async () => {
      const cle = 'team:entries:' + S.session.id;
      const toutes = (await kvGet(cle)) || {};
      toutes[S.semaine] = { ...d, majLe: new Date().toISOString() };
      await kvSet(cle, toutes);
      S.entries[S.session.id] = toutes;
      S.saisieModifiee = false;
      toast(`Semaine ${numSemaine(S.semaine)} enregistrée.`);
      rendreRep();
    });
  });
}

/* =====================================================================
   ESPACE MANAGER / PROPRIÉTAIRE
   ===================================================================== */
function rendreManager() {
  const proprio = S.session.role === 'owner';
  const reps = repsVisibles();
  const avecManager = proprio && S.filtre === 'tous' && S.managers.length > 0;

  const lignes = reps.map(r => {
    const d = saisieSemaine(r.id, S.semaine);
    return {
      entete: `<div class="nom-cell"><span class="avatar">${esc(initiales(r.name))}</span><div class="nom"><strong>${esc(r.name)}</strong>
        ${d ? (avecManager ? `<small>${esc(nomManager(r.managerId))}</small>` : '') : '<small><span class="puce puce-attente">Non déclaré</span></small>'}</div></div>`,
      d: d ? avecTaux(d) : null,
    };
  });
  const total = avecTaux(somme(reps.map(r => saisieSemaine(r.id, S.semaine))));
  const declares = reps.filter(r => saisieSemaine(r.id, S.semaine)).length;

  const filtre = proprio ? `
    <label class="filtre"><span>Afficher les téléprospecteurs de</span>
      <select id="filtre-manager">
        <option value="tous" ${S.filtre === 'tous' ? 'selected' : ''}>Tout le monde</option>
        <option value="moi" ${S.filtre === 'moi' ? 'selected' : ''}>Moi</option>
        ${S.managers.map(m => `<option value="${esc(m.id)}" ${S.filtre === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
      </select></label>` : '';

  $('main').innerHTML = `
    <section class="entete-page apparait">
      <div>
        <p class="surtitre">${proprio ? "Tableau de bord · vue d'ensemble" : 'Tableau de bord · mon équipe'}</p>
        <h1>Semaine ${numSemaine(S.semaine)} <span class="muted">· ${plageSemaine(S.semaine)}</span></h1>
      </div>
      <div class="actions-page">
        ${filtre}
        <button class="btn btn-ghost" data-action="actualiser" title="Recharger les dernières déclarations">${ic('actualiser')}<span>Actualiser</span></button>
        <button class="btn btn-primary" data-action="exporter">${ic('telecharger')}Exporter vers Excel</button>
      </div>
    </section>

    <section class="kpis apparait">
      <div class="carte kpi"><span class="lib">${ic('telephone')}Appels</span><span class="val">${fmtNombre(total.appels)}</span><span class="det"><b>${fmtNombre(total.heures, 2)} h</b> de travail</span></div>
      <div class="carte kpi"><span class="lib">${ic('graphique')}Taux de décroché</span><span class="val">${fmtPct(total.tDecroche)}</span><span class="det"><b>${fmtNombre(total.decroches)}</b> décrochés</span></div>
      <div class="carte kpi"><span class="lib">${ic('cible')}Retours</span><span class="val">${fmtNombre(total.retours)}</span><span class="det">Taux de retour <b>${fmtPct(total.tRetour)}</b></span></div>
      <div class="carte kpi"><span class="lib">${ic('fichier')}Déclarations</span><span class="val">${declares}<span class="muted" style="font-size:18px"> / ${reps.length}</span></span><span class="det">${reps.length - declares > 0 ? `<b>${reps.length - declares}</b> en attente` : 'Équipe complète'}</span></div>
    </section>

    <section class="carte apparait">
      <div class="carte-tete">
        <div><div class="titre">${ic('calendrier')}<h2>Suivi de la semaine</h2></div>
        <p>Une ligne par téléprospecteur · indicateur de performance selon le taux de décroché</p></div>
      </div>
      ${tableau({ premiereCol: 'Téléprospecteur', lignes, total, libelleTotal: 'Total équipe', avecSignal: true })}
    </section>

    <div class="grille-2 apparait">
      <section class="carte">
        <div class="carte-tete">
          <div><div class="titre">${ic('trophee')}<h2>Classement de la semaine</h2></div><p>Semaine ${numSemaine(S.semaine)}</p></div>
          ${segmentCritere()}
        </div>
        <div class="carte-corps">${classement(reps, r => saisieSemaine(r.id, S.semaine) || zero())}</div>
      </section>
      <section class="carte">
        <div class="carte-tete">
          <div><div class="titre">${ic('trophee')}<h2>Classement du mois</h2></div>
            <div class="mini-nav">
              <button class="btn-icone" data-action="mois" data-sens="-1" aria-label="Mois précédent">${ic('chevronG')}</button>
              <strong>${libelleMois(S.mois)}</strong>
              <button class="btn-icone" data-action="mois" data-sens="1" aria-label="Mois suivant" ${S.mois >= moisDeSemaine(SEMAINE_COURANTE) ? 'disabled' : ''}>${ic('chevronD')}</button>
            </div>
          </div>
          ${segmentCritere()}
        </div>
        <div class="carte-corps">${classement(reps, r => totalMois(r.id, S.mois))}</div>
      </section>
    </div>

    <div class="${proprio ? 'grille-2' : ''} apparait">
      ${blocEquipe(reps)}

  // Animation des barres de classement
  requestAnimationFrame(() => $('main').querySelectorAll('.barre > i[data-w]').forEach(i => { i.style.width = i.dataset.w; }));

  $('filtre-manager')?.addEventListener('change', e => { S.filtre = e.target.value; rendreManager(); });

function segmentCritere() {
  return `<div class="segment" role="group" aria-label="Critère de classement">
    <button data-action="critere" data-critere="retours" aria-pressed="${S.critere === 'retours'}">Retours</button>
    <button data-action="critere" data-critere="appels" aria-pressed="${S.critere === 'appels'}">Appels</button>
  </div>`;
}

function classement(reps, donnees) {
  const items = reps.map(r => ({ r, v: Number(donnees(r)[S.critere]) || 0 }))
    .sort((a, b) => b.v - a.v || a.r.name.localeCompare(b.r.name, 'fr'));
  if (!items.length || items.every(i => i.v === 0)) {
    return `<div class="vide-etat">${ic('trophee')}<span>Pas encore de ${S.critere === 'retours' ? 'retours' : 'appels'} sur cette période.</span></div>`;
  }
  const max = Math.max(...items.map(i => i.v));
  return `<ol class="classement">${items.map((i, n) => `
    <li>
      <span class="rang">${n + 1}</span>
      <div><div class="barre-nom"><span>${esc(i.r.name)}</span></div>
        <div class="barre"><i data-w="${max ? (i.v / max) * 100 : 0}%"></i></div></div>
      <span class="valeur">${fmtNombre(i.v)}</span>
    </li>`).join('')}</ol>`;
}

  return `
    <section class="carte">
      <div class="carte-tete">
        <div><div class="titre">${ic('equipe')}<h2>Mon équipe</h2></div>
        <p>${reps.length} téléprospecteur${reps.length > 1 ? 's' : ''}${proprio && S.filtre !== 'tous' ? ' (filtre actif)' : ''}</p></div>

        <form class="form-ligne ${proprio ? 'trois' : ''}" id="form-ajout-rep" novalidate>

          <button class="btn btn-primary" type="submit" data-action="ajouter-rep">${ic('plus')}Ajouter</button>

            <span class="avatar">${esc(initiales(r.name))}</span>

            ${secret(r.password, 'le mot de passe de ' + r.name)}
            <button class="btn-icone" data-action="modifier-rep" data-id="${esc(r.id)}" aria-label="Modifier ${esc(r.name)}" title="Modifier">${ic('crayon')}</button>
            <button class="btn-icone danger" data-action="supprimer-rep" data-id="${esc(r.id)}" aria-label="Supprimer ${esc(r.name)}" title="Supprimer">${ic('corbeille')}</button>
          </li>`).join('')}</ul>`

      </div>

/* --- Vérifications des codes et mots de passe --- */
async function verifierCodeManager(code, idIgnore = null) {
  if (code.length < 4) throw new Error("Le code d'accès doit contenir au moins 4 caractères.");
  if (S.managers.some(m => m.code === code && m.id !== idIgnore)) throw new Error('Ce code est déjà utilisé par un autre manager.');
  if (S.admin && (await hacher(code)) === S.admin.ownerHash) throw new Error('Ce code est celui du propriétaire.');
}
function verifierNomRep(nom, idIgnore = null) {
  if (!nom) throw new Error('Indiquez le nom du téléprospecteur.');
  if (S.reps.some(r => normaliser(r.name) === normaliser(nom) && r.id !== idIgnore)) throw new Error('Un téléprospecteur porte déjà ce nom.');
}
// Un manager secondaire ne peut agir que sur ses propres téléprospecteurs
function repAutorise(id) {
  const r = S.reps.find(x => x.id === id);
  if (!r) throw new Error("Ce téléprospecteur n'existe plus. Actualisez la page.");
  if (S.session.role === 'manager' && r.managerId !== S.session.id) throw new Error("Ce téléprospecteur n'appartient pas à votre équipe.");
  return r;
}

/* --- Actions du tableau de bord (délégation) --- */
$('main').addEventListener('click', async e => {
  const b = e.target.closest('[data-action]');
  if (!b || S.session?.role === 'rep') return;
  const action = b.dataset.action;

  if (action === 'critere') { S.critere = b.dataset.critere; rendreManager(); return; }
  if (action === 'mois') { S.mois = decalerMois(S.mois, Number(b.dataset.sens)); rendreManager(); return; }
  if (action === 'actualiser') {
    return tenter(b, async () => {
      await chargerTout();
      if (!sessionValide(S.session)) { toast('Votre accès a été supprimé.', 'erreur'); return deconnecter(); }
      rendreManager();
      toast('Données à jour.');
    });
  }
  if (action === 'exporter') return ouvrirExport();

  if (action === 'modifier-rep') {
    let r;
    try { r = repAutorise(b.dataset.id); } catch (x) { return toast(x.message, 'erreur'); }
    const proprio = S.session.role === 'owner';
    await modale({
      titre: `Modifier ${r.name}`,
      ok: 'Enregistrer',
      html: `
        <label class="champ"><span>Nom</span><input name="nom" value="${esc(r.name)}" required></label>
        ${champMdp('mdp', 'Mot de passe', { auto: 'new-password', valeur: r.password })}
        ${proprio ? `<label class="champ"><span>Rattacher à</span><select name="managerId">
          <option value="${OWNER}" ${r.managerId === OWNER ? 'selected' : ''}>Moi (propriétaire)</option>
          ${S.managers.map(m => `<option value="${esc(m.id)}" ${r.managerId === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
        </select></label>` : ''}`,
      valider: async d => {
        const nom = d.nom.trim();
        verifierNomRep(nom, r.id);
        if (d.mdp.length < 4) throw new Error('Le mot de passe doit contenir au moins 4 caractères.');
        S.reps = await majListe('team:reps', l => l.map(x => x.id === r.id
          ? { ...x, name: nom, password: d.mdp, managerId: proprio ? d.managerId : x.managerId } : x));
        toast('Téléprospecteur mis à jour.');
        rendreManager();
      },
    });
    return;
  }

  if (action === 'supprimer-rep') {
    let r;
    try { r = repAutorise(b.dataset.id); } catch (x) { return toast(x.message, 'erreur'); }
    if (!(await confirmer(`Supprimer ${r.name} ?`, `Son accès et tout son historique de déclarations seront définitivement supprimés.`))) return;
    return tenter(null, async () => {
      S.reps = await majListe('team:reps', l => l.filter(x => x.id !== r.id));
      await kvDel('team:entries:' + r.id);
      delete S.entries[r.id];
      toast(`${r.name} a été supprimé.`);
      rendreManager();
    });
  }

  if (S.session.role !== 'owner') return;

  if (action === 'modifier-manager') {
    const m = S.managers.find(x => x.id === b.dataset.id);
    if (!m) return;
    await modale({
      titre: `Modifier ${m.name}`,
      ok: 'Enregistrer',
      html: `<label class="champ"><span>Nom</span><input name="nom" value="${esc(m.name)}" required></label>
        ${champMdp('code', "Code d'accès", { auto: 'new-password', valeur: m.code })}`,
      valider: async d => {
        const nom = d.nom.trim();
        if (!nom) throw new Error('Indiquez un nom.');
        await verifierCodeManager(d.code, m.id);
        S.managers = await majListe('team:managers', l => l.map(x => x.id === m.id ? { ...x, name: nom, code: d.code } : x));
        toast('Manager mis à jour.');
        rendreManager();
      },
    });
    return;
  }

  if (action === 'supprimer-manager') {
    const m = S.managers.find(x => x.id === b.dataset.id);
    if (!m) return;
    const n = S.reps.filter(r => r.managerId === m.id).length;
    if (!(await confirmer(`Supprimer l'accès de ${m.name} ?`,
      n ? `Ses ${n} téléprospecteur${n > 1 ? 's' : ''} vous seront rattachés, avec leur historique.` : "Ce manager n'a aucun téléprospecteur."))) return;
    return tenter(null, async () => {
      S.reps = await majListe('team:reps', l => l.map(r => r.managerId === m.id ? { ...r, managerId: OWNER } : r));
      S.managers = await majListe('team:managers', l => l.filter(x => x.id !== m.id));
      if (S.filtre === m.id) S.filtre = 'tous';
      toast(`Accès de ${m.name} supprimé.`);
      rendreManager();
    });
  }

  if (action === 'code-proprio') {
    await modale({
      titre: 'Changer le code propriétaire',
      ok: 'Changer le code',
      html: `${champMdp('actuel', 'Code actuel')}
        ${champMdp('code', 'Nouveau code', { auto: 'new-password' })}
        ${champMdp('code2', 'Confirmer le nouveau code', { auto: 'new-password' })}`,
      valider: async d => {
        if ((await hacher(d.actuel)) !== S.admin.ownerHash) throw new Error('Le code actuel est incorrect.');
        if (d.code.length < 6) throw new Error('Le nouveau code doit contenir au moins 6 caractères.');
        if (d.code !== d.code2) throw new Error('Les deux codes ne correspondent pas.');
        if (S.managers.some(m => m.code === d.code)) throw new Error("Ce code est déjà celui d'un manager.");
        S.admin = { ...S.admin, ownerHash: await hacher(d.code), majLe: new Date().toISOString() };
        await kvSet('team:admin', S.admin);
        toast('Code propriétaire modifié.');
      },
    });
  }
});

/* --- Formulaires d'ajout (délégation sur submit) --- */
$('main').addEventListener('submit', e => {
  const form = e.target;
  if (form.id !== 'form-ajout-rep' && form.id !== 'form-ajout-manager') return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form));
  const nom = (d.nom || '').trim();

  tenter(form.querySelector('[type=submit]'), async () => {
    if (form.id === 'form-ajout-rep') {
      verifierNomRep(nom);
      if ((d.mdp || '').length < 4) throw new Error('Le mot de passe doit contenir au moins 4 caractères.');
      const managerId = S.session.role === 'owner' ? (d.managerId || OWNER) : S.session.id;
      S.reps = await majListe('team:reps', l => {
        if (l.some(r => normaliser(r.name) === normaliser(nom))) throw new Error('Un téléprospecteur porte déjà ce nom.');
        return [...l, { id: uid('r'), name: nom, password: d.mdp, managerId, creeLe: new Date().toISOString() }];
      });
      toast(`${nom} a rejoint l'équipe.`);
    } else {
      if (!nom) throw new Error('Indiquez le nom du manager.');
      await verifierCodeManager(d.code || '');
      S.managers = await majListe('team:managers', l => [...l, { id: uid('m'), name: nom, code: d.code, creeLe: new Date().toISOString() }]);
      toast(`Accès manager créé pour ${nom}.`);
    }
    rendreManager();
  });
});

/* =====================================================================
   EXPORT EXCEL (SheetJS)
   ===================================================================== */
async function ouvrirExport() {
  const reps = repsVisibles();
  if (!reps.length) return toast("Aucun téléprospecteur à exporter.", 'erreur');
  await modale({
    titre: 'Exporter vers Excel',
    ok: 'Télécharger le fichier',
    html: `
      <fieldset class="choix"><legend>Période</legend>
        <label class="option"><input type="radio" name="periode" value="semaine" checked>
          <span><strong>Semaine affichée · S${numSemaine(S.semaine)}</strong><small>${plageSemaine(S.semaine)}</small></span></label>
        <label class="option"><input type="radio" name="periode" value="mois">
          <span><strong>Mois affiché · ${libelleMois(S.mois)}</strong><small>${semainesDuMois(S.mois).length} semaines, détail par semaine inclus</small></span></label>
      </fieldset>
      <label class="champ"><span>Portée</span>
        <select name="portee">
          <option value="equipe">Toute l'équipe (${reps.length} téléprospecteur${reps.length > 1 ? 's' : ''})</option>
          ${reps.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}
        </select></label>`,
    valider: async d => exporterExcel(d.periode, d.portee),
  });
}

function exporterExcel(periode, portee) {
  if (!window.XLSX) throw new Error("La librairie Excel n'a pas pu être chargée. Vérifiez votre connexion puis rechargez la page.");
  const reps = repsVisibles();   // un manager secondaire ne voit que les siens
  const equipe = portee === 'equipe';
  const repSeul = equipe ? null : reps.find(r => r.id === portee);
  if (!equipe && !repSeul) throw new Error("Ce téléprospecteur n'est pas dans votre périmètre.");

  const semaines = periode === 'semaine' ? [S.semaine] : semainesDuMois(S.mois);
  const libPeriode = periode === 'semaine'
    ? `Semaine ${numSemaine(S.semaine)} (${plageSemaine(S.semaine)})`
    : `${libelleMois(S.mois)} (semaines ${semaines.map(numSemaine).join(', ')})`;
  const codePeriode = periode === 'semaine' ? semaineFichier(S.semaine) : S.mois;

  const colsChiffres = CHAMPS.map(c => c.label + (c.unite ? ' (h)' : ''));
  const colsTaux = TAUX.map(t => t.label);
  const valeurs = e => {
    const d = avecTaux(e);
    return [...CHAMPS.map(c => d[c.k]), ...TAUX.map(t => d[t.k] ?? '')];
  };
  const wb = XLSX.utils.book_new();

  // Construit une feuille : titre, sous-titre, en-têtes, lignes, total
  const feuille = (titre, enTetes, lignes, total) => {
    const aoa = [[titre], [libPeriode + ' · exporté le ' + new Date().toLocaleDateString('fr-FR')], [], enTetes, ...lignes, total];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const debutTaux = enTetes.length - TAUX.length;
    for (let r = 4; r < aoa.length; r++) {
      for (let c = debutTaux; c < enTetes.length; c++) {
        const cell = ws[XLSX.utils.encode_cell({ r, c })];
        if (cell && typeof cell.v === 'number') cell.z = '0.0%';
      }
      const h = ws[XLSX.utils.encode_cell({ r, c: enTetes.indexOf(colsChiffres[0]) })];
      if (h && typeof h.v === 'number') h.z = '0.00';
    }
    ws['!cols'] = enTetes.map((h, i) => ({ wch: i === 0 ? 28 : Math.max(11, h.length + 2) }));
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 3, c: 0 }, e: { r: 3 + lignes.length, c: enTetes.length - 1 } }) };
    return ws;
  };

  let nomFichier;
  if (equipe) {
    const nomEquipe = S.session.role === 'manager'
      ? 'equipe-' + slug(infosSession().nom)
      : (S.filtre === 'tous' ? 'equipe' : 'equipe-' + slug(S.filtre === 'moi' ? 'proprietaire' : nomManager(S.filtre)));
    // Récapitulatif : une ligne par téléprospecteur
    const enTetes = ['Téléprospecteur', 'Manager', ...colsChiffres, ...colsTaux];
    const lignes = reps.map(r => [r.name, nomManager(r.managerId), ...valeurs(somme(semaines.map(s => saisieSemaine(r.id, s))))]);
    const total = ['Total équipe', '', ...valeurs(somme(reps.flatMap(r => semaines.map(s => saisieSemaine(r.id, s)))))];
    XLSX.utils.book_append_sheet(wb, feuille('Prospection téléphonique · équipe', enTetes, lignes, total), 'Récapitulatif');

    // Mois : détail par semaine et par téléprospecteur
    if (periode === 'mois') {
      const enTetesD = ['Téléprospecteur', 'Semaine', ...colsChiffres, ...colsTaux];
      const lignesD = reps.flatMap(r => semaines.map(s => [r.name, `S${numSemaine(s)}`, ...valeurs(saisieSemaine(r.id, s) || zero())]));
      XLSX.utils.book_append_sheet(wb, feuille('Détail par semaine', enTetesD, lignesD, total), 'Détail par semaine');
    }
    nomFichier = `prospection_${nomEquipe}_${codePeriode}.xlsx`;
  } else {
    // Un téléprospecteur : une ligne par semaine
    const enTetes = ['Semaine', ...colsChiffres, ...colsTaux];
    const lignes = semaines.map(s => [`S${numSemaine(s)} · ${plageSemaine(s)}`, ...valeurs(saisieSemaine(repSeul.id, s) || zero())]);
    const total = [periode === 'semaine' ? 'Total semaine' : 'Total du mois', ...valeurs(somme(semaines.map(s => saisieSemaine(repSeul.id, s))))];
    XLSX.utils.book_append_sheet(wb, feuille(`Prospection téléphonique · ${repSeul.name}`, enTetes, lignes, total), repSeul.name.slice(0, 31).replace(/[\\/?*[\]:]/g, ' '));
    nomFichier = `prospection_${slug(repSeul.name)}_${codePeriode}.xlsx`;
  }

  XLSX.writeFile(wb, nomFichier);
  toast(`Fichier ${nomFichier} téléchargé.`);
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
window.addEventListener('beforeunload', e => {
  if (S.saisieModifiee) { e.preventDefault(); e.returnValue = ''; }
});

async function init() {
  appliquerLogo();
  if (!CONFIG_OK) return afficherConfigManquante();
  afficher('ecran-chargement');
  try {
    await chargerTout();
  } catch (e) {
    console.error(e);
    $('ecran-config').innerHTML = `
      <div class="carte-auth simple apparait"><div class="auth-form">
        <div class="logo-ligne"><img src="${logoUrl()}" alt=""><span>${esc(TITRE_APPLI)}</span></div>
        <div><h2>Impossible de charger les données</h2><p class="intro">${esc(e.message)}</p></div>
        <button class="btn btn-primary" onclick="location.reload()">${ic('actualiser')}Réessayer</button>
      </div></div>`;
    return afficher('ecran-config');
  }
  if (!S.admin) return afficherSetup();
  const s = lireSession();
  if (sessionValide(s)) { S.session = s; afficherApp(); }
  else afficherConnexion();
}
init();
</script>
